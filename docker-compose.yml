# 1Panel 「容器 → 编排」里直接粘贴本文件即可部署。
# 也可以在「容器 → 镜像 → 构建镜像」中直接用 Dockerfile 构建后创建容器。
services:
  ie-webdisk:
    build: .
    image: ie-webdisk:latest
    container_name: ie-webdisk
    restart: always
    ports:
      # 宿主机端口:容器端口；若在 1Panel 里用「网站 → 反向代理」暴露，可改成 "127.0.0.1:3000:3000"
      - "3000:3000"
    environment:
      # ==== 可选功能开关（默认都是 false，即开箱即用：直接上传/下载）====
      # 是否需要登录后才能上传/删除。true = 需要登录
      - REQUIRE_LOGIN=false
      # 是否需要 6 位数字提取码。true = 凭提取码下载
      - REQUIRE_CODE=false
      # ==== 账号（仅当 REQUIRE_LOGIN=true 时生效，务必修改）====
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin123
      # 额外账号，格式 用户名:密码,用户名:密码
      # - USERS=zhang:123456,li:abcdef
      # ==== 业务参数 ====
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      # 单文件大小上限（字节），默认 500MB；Nginx 反向代理还需同步放开 client_max_body_size
      - MAX_FILE_SIZE=524288000
      # 有效期可选值（天）与默认值
      - EXPIRE_DAYS=1,3,7,30
      - DEFAULT_EXPIRE_DAYS=7
      # 下载频率限制
      - RATE_WINDOW_MS=60000
      - RATE_MAX=30
    volumes:
      # 持久化：上传的文件和 files.json 都在这里
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s